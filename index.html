<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>SO-HMNS GLOBAL REAL-TIME ENFORCED OBSERVER</title>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; font-weight: bold; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 30px; text-transform: uppercase; }
        .paypal-btn { background-color: #0070ba; color: white; text-decoration: none; padding: 15px 40px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; width: 80%; max-width: 400px; text-align: center; margin-bottom: 40px; display: block; }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 20px; }
        .card { background-color: #121824; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status-badge { background-color: #ef4444; color: #ffffff; font-weight: bold; font-size: 0.75rem; padding: 4px 12px; border-radius: 6px; }
        .timestamp { color: #94a3b8; font-size: 0.8rem; }
        .region-title { color: #f87171; font-size: 1.4rem; font-weight: bold; margin: 0 0 10px 0; }
        .moment-box { background-color: #090d16; border-radius: 6px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .moment-value { color: #f59e0b; font-size: 1.3rem; font-weight: bold; }
        .api-status { font-size: 0.8rem; color: #10b981; margin-bottom: 20px; font-family: monospace; }
        .no-data { text-align: center; color: #64748b; padding: 40px; }
    </style>
</head>
<body>
    <div class="header">🛰️ SO-HMNS GLOBAL REAL-TIME OBSERVER</div>
    <a href="https://paypal.me" class="paypal-btn" target="_blank">PayPal Support</a>
    <div class="api-status" id="system-status">● SYSTEM INTEGRITY: FETCHING LIVE USGS DATA CHAIN...</div>
    <div class="container" id="observer-container"></div>
    <script>
        const USGS_API_URL = "https://usgs.gov";
        async function fetchRealTimeEarthquakes() {
            const container = document.getElementById('observer-container');
            const statusNode = document.getElementById('system-status');
            try {
                const response = await fetch(USGS_API_URL);
                if (!response.ok) throw new Error("API Connection Failed");
                const data = await response.json();
                container.innerHTML = '';
                statusNode.innerHTML = `● SYSTEM INTEGRITY: ACTIVE (LAST SYNC: ${new Date().toLocaleTimeString()})`;
                const features = data.features.slice(0, 5);
                if (features.length === 0) {
                    container.innerHTML = '<div class="no-data">🌌 현재 지구 전역 매니폴드 상에 고위험 지각 충격파가 관측되지 않았습니다.</div>';
                    return;
                }
                features.forEach(eq => {
                    const props = eq.properties;
                    const date = new Date(props.time);
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="status-badge">LIVE SEISMIC EVENT</span>
                            <span class="timestamp">🕒 ${date.toUTCString()}</span>
                        </div>
                        <h2 class="region-title">🌏 ${props.place || "Unknown Location"}</h2>
                        <div class="moment-box">
                            <span class="moment-value">M ${props.mag.toFixed(2)}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                statusNode.innerHTML = `▲ SYSTEM ARTIFACT: API TIMEOUT`;
                container.innerHTML = '<div class="no-data">❌ 실시간 피드를 렌더링할 수 없습니다.</div>';
            }
        }
        fetchRealTimeEarthquakes();
        setInterval(fetchRealTimeEarthquakes, 30000);
    </script>
</body>
</html>
