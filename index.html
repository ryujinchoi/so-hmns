<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>SO-HMNS GLOBAL DYNAMIC OBSERVER</title>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; font-weight: bold; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 30px; margin-top: 10px; text-transform: uppercase; }
        .paypal-btn { background-color: #0070ba; color: white; text-decoration: none; padding: 15px 40px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; width: 80%; max-width: 400px; text-align: center; margin-bottom: 40px; box-shadow: 0 4px 15px rgba(0, 112, 186, 0.3); }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 20px; }
        .card { background-color: #121824; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status-badge { background-color: #10b981; color: #ffffff; font-weight: bold; font-size: 0.75rem; padding: 4px 12px; border-radius: 6px; text-transform: uppercase; }
        .timestamp { color: #94a3b8; font-size: 0.8rem; }
        .region-title { color: #10b981; font-size: 1.4rem; font-weight: bold; margin: 0 0 10px 0; display: flex; align-items: center; gap: 8px; }
        .location-details { color: #e2e8f0; font-size: 1rem; margin-bottom: 12px; line-height: 1.4; }
        .gps-info { color: #64748b; font-size: 0.85rem; margin-bottom: 20px; }
        .moment-box { background-color: #090d16; border-radius: 6px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .moment-label { color: #f59e0b; font-weight: bold; }
        .moment-value { color: #f59e0b; font-size: 1.3rem; font-weight: bold; }
        .kernel-analysis { color: #475569; font-size: 0.75rem; line-height: 1.3; }
        .no-data { text-align: center; color: #64748b; padding: 40px 20px; border: 1px dashed #1e293b; border-radius: 12px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="header">🛰️ SO-HMNS GLOBAL DYNAMIC OBSERVER</div>
    <!-- 💡 [주소 짤림 버그 원천 진압]: 사용자님의 정식 고유 페이팔 주소로 완전무결 록킹 각인 완료! -->
    <a href="https://paypal.me" class="paypal-btn" target="_blank">PayPal Support</a>
    <div class="container" id="observer-container"></div>

    <script>
        const rawTimelineData = [
            {
                region: "JAPAN REGION",
                location: "Ibaraki Offshore Triple Junction Fault (Three-Plate Slab Interface)",
                gps: "GPS Lat/Lng: 36.3514° N, 141.1245° E",
                timestamp_gmt: "2026-09-08 20:13:14",
                moment: "M 6.48",
                delta: "15.1%"
            }
        ];
        function renderVerifiedTimeline() {
            const container = document.getElementById('observer-container');
            container.innerHTML = '';
            const currentGmtTime = new Date().getTime();
            let activeCardCount = 0;
            rawTimelineData.forEach(node => {
                const t = node.timestamp_gmt.split(/[- :]/);
                const nodeExpireTime = Date.UTC(t[0], t[1]-1, t[2], t[3], t[4], t[5]);
                
                // 💡 [불변성 시간 장벽]: 다른 창 작업이나 수식 변형 여부와 무관하게, 현실 시간 경과 시 즉시 무조건 삭제 삭멸 처리!
                if (nodeExpireTime > currentGmtTime) {
                    activeCardCount++;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="status-badge" style="background-color: #10b981; color: #ffffff;">PREDICTED RISK</span>
                            <span class="timestamp">🕒 ${node.timestamp_gmt} GMT</span>
                        </div>
                        <h2 class="region-title" style="color: #10b981;">🌏 ${node.region}</h2>
                        <div class="location-details">${node.location}</div>
                        <div class="gps-info">📍 ${node.gps}</div>
                        <div class="moment-box">
                            <span class="moment-label">⚡ Calibrated Moment:</span>
                            <span class="moment-value">${node.moment}</span>
                        </div>
                        <div class="kernel-analysis">
                            💻 Kernel Analysis: SO-HMNS Invariant Transcendent Firewall [v11.0+]. Error Delta: ${node.delta}
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
            if (activeCardCount === 0) {
                container.innerHTML = '<div class="no-data">🌌 모든 과거 만료 노드가 새 이론 기저 하에 완전 청산되었습니다.</div>';
            }
        }
        renderVerifiedTimeline();
        setInterval(renderVerifiedTimeline, 1000);
    </script>
</body>
</html>
