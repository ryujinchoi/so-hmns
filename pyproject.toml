[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "so-hmns"
version = "1.0.0"
description = "Universal Grand Unification Infrastructure over Discrete Rational Hardware Lattice (ℚ)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ryujin Choi" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["quantum", "fluid", "riemann", "blackhole", "gravity", "rational-lattice"]
