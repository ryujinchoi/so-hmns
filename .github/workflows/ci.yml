name: SO-HMNS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-invariants:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-state-validation: true

    - name: Verify Hardware Lattice and Transpiler Pipeline
      run: |
        chmod +x run_pipeline.sh
        python MILLENNIUM_EXPLICIT_SOLVER.py
        ./run_pipeline.sh
