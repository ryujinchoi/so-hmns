name: Lean 4 Formal Verification
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Install Elan
      run: |
        curl https://githubusercontent.com -sSf | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH
    - name: Check Lean & Lake Build
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        lean --version
        lake exe cache get || true
        lake build
