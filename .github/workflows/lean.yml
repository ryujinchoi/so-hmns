name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 원격 가상머신 내부로 소스코드 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 공식 인증된 leanprover/lean-action@v1 기본 사양으로 가상머신 툴체인 완착 이식
    - name: Setup Lean 4
      uses: leanprover/lean-action@v1

    # 3. Mathlib 4 캐시 전량 동기화 인출 및 39대 Landmark 전체 파일 최종 컴파일 빌드 주행
    - name: Build Project
      run: |
        lake exe cache get
        lake build
