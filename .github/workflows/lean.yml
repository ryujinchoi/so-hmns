name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 원격 가상머신 내부선 상으로 최류진 저장소 소스코드 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 잘못된 elan-version 인자를 전면 제거하고 공식 액션 기본 사양으로 가상머신에 Lean 4 환경 자동 이식
    - name: Setup Lean 4
      uses: leanprover/lean-action@v1

    # 3. Mathlib 4 캐시 전량 동기화 인출 및 39대 Landmark 전체 파일 최종 컴파일 빌드 주행
    - name: Build Project
      run: |
        lake exe cache get
        lake build
