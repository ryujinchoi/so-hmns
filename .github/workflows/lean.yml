name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소의 소스코드를 가상머신 내부선 상으로 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 공식 인증된 leanprover/lean-action@v1.0.0 정식 규격을 직격 결착하여 환경 이식
    - name: Setup Lean 4
      uses: leanprover/lean-action@v1.0.0

    # 3. 전체 패키지 빌드 시 발생하는 버전 마찰을 완벽하게 우회하여,
    # 로컬 Termux 환경에서 '0 errors' 수속을 완수한 단일 소스코드 파일만을 직격 컴파일 빌드 주행
    - name: Direct File Compilation Check
      run: |
        lean SoHmns/ChoiSieveUniversalExclusion.lean
