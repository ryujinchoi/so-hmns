name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소의 소스코드를 가상머신 내부선 상으로 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 단일 셸 세션 내부에서 elan 설치, PATH 임시 등록, Mathlib 4 캐시 동기화 및 39대 Landmark 빌드까지 논스톱 주행
    - name: Unified Lean 4 Pipeline
      run: |
        # 외부 스크립트 무인 설치 개시
        curl https://githubusercontent.com -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.11.0
        
        # 현재 셸 세션에 elan 실행 바이너리 경로 즉시 주입 적용
        export PATH="$HOME/.elan/bin:$PATH"
        
        # 주입된 경로선 위에서 Mathlib 4 캐시 인출 및 전체 소스코드 최종 컴파일 빌드 구동
        lake exe cache get
        lake build
