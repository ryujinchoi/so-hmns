name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 원격 가상머신 내부선 상으로 소스코드 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. leanprover 공식 액션을 사용하여 가상머신에 elan 및 툴체인(v4.11.0) 자동 연립 이식
    - name: Setup Lean 4
      uses: leanprover/lean-action@v1
      with:
        elan-version: 'v4.11.0'

    # 3. Mathlib 4 캐시 동기화 및 39대 Landmark 전체 파일 최종 컴파일 빌드 주행
    - name: Build Project
      run: |
        lake exe cache get
        lake build
