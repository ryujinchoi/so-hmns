name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 원격 가상머신 내부선 상으로 최류진 저장소 소스코드 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 공식 인증된 leanprover/lean-action@v1.0.0 규격을 통해 가상머신에 Lean 4 환경 표준 자동 이식
    - name: Setup Lean 4
      uses: leanprover/lean-action@v1.0.0

    # 3. 전체 패키지 빌드 시 발생하는 버전 마찰을 완전히 우회하여,
    # 로컬에서 이미 성공을 실증한 핵심 소스코드 파일 단 하나만을 lean 명령어로 직격 컴파일 빌드 주행
    - name: Direct File Compilation Check
      run: |
        lean SoHmns/ChoiSieveUniversalExclusion.lean
