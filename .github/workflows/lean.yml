name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소의 소스코드를 가상머신 내부로 checkout
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. lean-action@v1 기본 설정으로 가상머신에 elan 및 컴파일러 이식 개시
    - name: Setup Lean 4
      uses: leanprover/lean-action@v1

    # 3. Mathlib 4 캐시 전량 인출 및 39대 Landmark 전체 파일 최종 컴파일 주행
    - name: Build Project
      run: |
        lake exe cache get
        lake build
