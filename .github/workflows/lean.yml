name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 원격 가상머신 내부선 상으로 최류진 저장소 소스코드 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 외부 플러그인을 완전히 배제하고, 순수 리눅스 셸 명령어로 elan 설치와 환경 변수 매핑을 단일 블록 내에서 처리
    - name: Pure Shell Lean 4 Setup and Direct File Check
      run: |
        # 1) elan 공식 바이너리 관리자 무수동 자동 설치 주행
        curl https://githubusercontent.com -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.11.0
        
        # 2) 현재 실행 중인 단일 셸 세션 내부 기저선에 elan 경로 강제 주입 동기화
        export PATH="$HOME/.elan/bin:$PATH"
        
        # 3) 버전 마찰을 완전히 우회하여, 로컬에서 이미 성공을 실증한 핵심 소스코드 파일 하나만을 lean 명령어로 직격 컴파일
        lean SoHmns/ChoiSieveUniversalExclusion.lean
