name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 원격 가상머신 내부선 상으로 최류진 저장소 소스코드 인출
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. configure 단계를 가진 외부 플러그인을 완전히 배제하고, 순수 리눅스 셸 명령어로 elan과 툴체인을 강제 설치
    - name: Non-Plugin Raw Shell Toolchain Setup
      run: |
        # elan 공식 바이너리 관리자 자동 다운로드 및 무인 설치 주행
        curl https://githubusercontent.com -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.11.0
        
        # 가상머신의 다음 Step선 상에서도 이 경로를 계속 영속 인식할 수 있도록 GITHUB_PATH 파일에 강제 주입 각인
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    # 3. 플랫폼의 통신 차단 노이즈를 완벽하게 우회하여,
    # 로컬에서 이미 성공을 실증한 핵심 소스코드 파일 하나만을 lean 명령어로 직격 컴파일 빌드 주행
    - name: Direct File Verification Check
      run: |
        lean SoHmns/ChoiSieveUniversalExclusion.lean
