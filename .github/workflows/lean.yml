name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소의 소스코드를 가상머신 내부선 상으로 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. curl 없이 가상머신 내부에 사전 이식되어 숨겨진 내장 elan/lean bin 경로를 강제 발굴하여 PATH 사슬에 고정 결착
    - name: Setup Embedded Lean 4 Path
      run: |
        if [ -d "$HOME/.elan/bin" ]; then
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
        elif [ -d "/usr/local/bin" ]; then
          echo "/usr/local/bin" >> $GITHUB_PATH
        fi
        echo "/opt/elan/bin" >> $GITHUB_PATH

    # 3. 네트워크 지연 노이즈를 우회하여 로컬 캐시 원장 대조 후 39대 Landmark 전체 파일 최종 컴파일 빌드 주행
    - name: Build Project with Embedded Compiler
      run: |
        # 바이너리 직접 타격 및 가동 연산
        lake exe cache get || true
        lake build
