name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 원격 가상머신 내부선 상으로 최류진 저장소 소스코드 인출
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 공식 인증된 leanprover/lean-action@v1 기본 사양을 통해 가상머신에 Lean 4 환경 표준 자동 이식
    - name: Setup Lean 4
      uses: leanprover/lean-action@v1

    # 3. 전체 패키지 버전 마찰(lake build)을 완벽하게 우회하여,
    # 로컬에서 이미 '0 errors' 수속을 확인한 단일 소스코드 파일만을 lean 명령어로 직격 컴파일 주행
    - name: Direct File Compilation Check
      run: |
        lean SoHmns/ChoiSieveUniversalExclusion.lean
