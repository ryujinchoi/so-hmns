name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 원격 가상머신 내부선 상으로 소스코드 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 단일 셸 세션 내부에서 elan 설치, PATH 등록, Mathlib 4 캐시 인출 및 39대 Landmark 빌드까지 논스톱 주행
    - name: Non-stop Lean 4 Setup and Build
      run: |
        # elan 배포 엔진 무인 자동 설치 주행
        curl https://githubusercontent.com -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.11.0
        
        # 현재 실행 세션의 환경 변수 기저선에 elan 경로 강제 주입 동기화
        export PATH="$HOME/.elan/bin:$PATH"
        
        # 주입된 경로선 위에서 Mathlib 4 캐시 전량 인출 및 전체 소스코드 최종 컴파일 빌드 구동
        lake exe cache get
        lake build
