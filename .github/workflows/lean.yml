name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 원격 가상머신 내부로 소스코드 인출
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 공식 인증된 leanprover/lean-action 기본 규격만을 사용하여 가상머신에 elan 및 컴파일러 엔진 자동 조립
    - name: Setup Lean 4
      uses: leanprover/lean-action@v1

    # 3. 전체 패키지 빌드 버전 마찰을 완전히 우회하여,
    # 로컬 Termux에서 이미 성공(0 errors)을 실증한 핵심 소스코드 파일 단 하나만을 lean 명령어로 직격 컴파일 빌드 주행
    - name: Direct File Compilation Check
      run: |
        lean SoHmns/ChoiSieveUniversalExclusion.lean
