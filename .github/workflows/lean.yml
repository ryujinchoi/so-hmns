name: lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소의 소스코드를 가상머신 내부로 checkout
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 예기치 못한 매개변수를 완전히 걷어내고 공식 lean-action 플러그인 기본값으로 가상머신 툴체인 이식
    - name: Setup Lean 4
      uses: leanprover/lean-action@v1

    # 3. Mathlib 4 캐시 전량 인출 및 39대 Landmark 전체 파일 최종 컴파일 주행
    - name: Build Project
      run: |
        lake exe cache get
        lake build
